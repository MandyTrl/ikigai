name: CI
run-name: CI de ${{ github.actor }} sur ${{ github.ref_name }}

#repères : `on` (quand) `jobs` (quoi) `steps` (comment)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn # Garde en cache les dépendances yarn pour accélérer les prochains runs.
      - name: Installer les dépendances
        run: yarn install --frozen-lockfile
      - name: Vérifier le style du code
        run: yarn lint

  typecheck:
    runs-on: ubuntu-latest
    name: Typecheck TypeScript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Installer les dépendances
        run: yarn install --frozen-lockfile
      - name: Générer les types Next.js
        run: yarn next typegen # next-env.d.ts est gitignoré : sans lui, tsc ne connaît pas les imports d'images (*.webp)
      - name: Vérifier les types
        run: yarn tsc --noEmit

  build:
    runs-on: ubuntu-latest
    name: Build Next.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn
      - name: Installer les dépendances
        run: yarn install --frozen-lockfile
      - name: Builder l'application
        run: yarn build
