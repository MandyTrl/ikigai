name: CI

#repères : `on` (quand) `jobs` (quoi) `steps` (comment)

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn # Garde en cache les dépendances yarn pour accélérer les prochains runs.

      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn next typegen # next-env.d.ts est gitignoré : sans lui, tsc ne connaît pas les imports d'images (*.webp)
      - run: yarn tsc --noEmit
      - run: yarn build
