<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" 
viewBox="0 0 700 700" width="100%" height="100%">
	<defs>
		<filter id="nnnoise-filter" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse" color-interpolation-filters="linearRGB">
			<feTurbulence type="turbulence" baseFrequency="0.2" numOctaves="4" seed="27" stitchTiles="stitch" x="0%" y="0%" width="100%" height="100%" result="turbulence"></feTurbulence>
		</filter>

		<filter id="nnnoise-test" x="-20%" y="-20%" width="140%" height="140%" 
		filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse" color-interpolation-filters="linearRGB">
			<feTurbulence type="turbulence" baseFrequency="0.6" numOctaves="5" seed="1" stitchTiles="stitch" x="0%" y="0%" width="100%" height="100%" result="turbulence"></feTurbulence>
		</filter>
	</defs>

	<rect width="100%" height="100%" fill="#1a2332" filter="url(#nnnoise-filter)" opacity="0.5"></rect>
	<rect width="100%" height="100%" fill="#d4a574" filter="url(#nnnoise-test)" opacity="0.4"></rect>
</svg>